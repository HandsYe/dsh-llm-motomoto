# The MotoMoto provider route is deliberately NOT declared here: protocol,
# baseURL, credential reference and models are the user's to own, and they
# already live in the user settings layer — the `llm-pi-ai:` section of
# ~/.dsh/settings.yaml. dsh-settings resolves that section from the user
# layer alone when a bundle ships no base, so this patch contributes exactly
# one thing: the runtime half that installs the outbound compatibility the
# Codex-only relay requires (the identity fence in lib/index.js).
- insert:
    - id: llm-motomoto
      name: dsh-llm-motomoto
