# The MotoMoto provider route is the composition base under the user settings
# layer: dsh-settings deep-merges the llm-pi-ai section over this config
# (objects merge per key, arrays replace wholesale), so a route the user edits
# in ~/.dsh/settings.yaml wins field by field while a fresh install serves
# gpt-5.6-terra before any user configuration exists.
#
# The relay is Codex-only: it serves the OpenAI Responses API (/v1/responses)
# and leaves /v1/chat/completions unwired, and it admits requests by their
# User-Agent. The protocol is this route's `api`; the Codex User-Agent itself
# is installed by the runtime half's fetch fence (lib/index.js).
- id: llm-pi-ai
  config:
    providers:
      motomoto:
        displayName: MotoMoto
        apiKeyEnv: MOTOMOTO_API_KEY
        api: openai-responses
        baseURL: https://motomoto.lol/v1
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        defaultInput:
          - text
        models:
          - id: gpt-5.6-terra
            name: GPT 5.6 Terra
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
# Load the runtime half: it registers the `llm-motomoto` settings section the
# plugins tab requires before it will dispatch the browser half's card.
- insert:
    - id: llm-motomoto
      name: dsh-llm-motomoto
